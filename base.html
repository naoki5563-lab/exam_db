{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}大学受験 英文DB{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'db_browser/styles.css' %}">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8645162707656222" crossorigin="anonymous"></script>
    <script src="{% static 'db_browser/transitions.js' %}" defer></script>
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="app-header">
      <div>
        <a class="brand" href="{% url 'db_browser:index' %}">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>大学受験 英文DB</span>
        </a>
        <p class="subtitle">入試英文から文法・論理・語彙を確認</p>
      </div>
      <nav class="header-actions">
        <a href="{% url 'db_browser:index' %}">英文一覧</a>
        <a href="{% url 'db_browser:global_search' %}">全体検索</a>
      </nav>
    </header>

    <main class="layout {% block layout_class %}{% endblock %}">
      <aside class="exam-nav" aria-label="入試英文一覧">
        <div class="side-title">入試英文</div>
        {% for item in passage_nav %}
          <a class="exam-link{% if item.active %} active{% endif %}" href="{{ item.url }}">
            <span class="exam-title">{{ item.source_exam }}</span>
            <span class="exam-meta">{{ item.year }} / {{ item.topic }}</span>
          </a>
        {% empty %}
          <p class="side-empty">英文データがありません。</p>
        {% endfor %}
      </aside>
      <section class="content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </body>
</html>
